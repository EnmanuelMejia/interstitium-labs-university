name: Deploy university Worker (manual, production)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: university-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Check JavaScript
        run: |
          for file in js/*.js worker.js; do node --check "$file"; done
      - name: Verify catalog and routes
        run: node scripts/validate.mjs
      - name: Verify brand and public asset exclusions
        run: node scripts/brand-check.mjs
      - name: Verify adaptive engine
        run: node js/adaptive.selftest.mjs
      - name: Confirm authorized Cloudflare secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository secret'; exit 1; }
      - name: Deploy the existing university Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.146.0 deploy --config wrangler.jsonc
      - name: Verify live university release
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://learn.interstitiumlabs.dev/manifest.webmanifest?release=' + encodeURIComponent(process.env.DEPLOY_SHA);
          for (let attempt = 1; attempt <= 6; attempt++) {
            try {
              const response = await fetch(url, {headers: {'Cache-Control': 'no-cache'}, signal: AbortSignal.timeout(12000)});
              if (!response.ok) throw new Error('Manifest HTTP ' + response.status);
              const data = await response.json();
              if (data.theme_color !== '#0a0f1d' || data.icons?.[0]?.src !== 'assets/il-brand-mark.svg') throw new Error('Old university release is still served');
              console.log('Verified university manifest on production host.');
              process.exit(0);
            } catch (error) {
              console.log('Attempt ' + attempt + '/6: ' + error.message);
              if (attempt === 6) throw error;
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
          }
          NODE
